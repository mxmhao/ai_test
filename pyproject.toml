[project]
name = "ai-test"
version = "0.1.0"
description = "冒烟测试仓库：验证 GitHub 远程仓库连通性与 CI 链路"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# greeter.py 位于仓库根，让测试可从根导入
pythonpath = ["."]
testpaths = ["tests"]
